# CPU checks on every push and pull request. GPU checks need ROCm hardware: run tests/run.sh locally.
name: cpu
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev procps gdb heaptrack clang libclang-rt-18-dev llvm libunwind-dev python3-numpy python3-venv nodejs
      - name: Install Mojo
        run: python3 -m venv .venv && .venv/bin/pip install --quiet mojo==1.1.0
      - name: Test
        run: tests/run.sh --cpu
