# CPU checks on every push and pull request. GPU checks need ROCm hardware: run tests/run.sh locally.
name: cpu
on: [push, pull_request]
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev procps gdb heaptrack clang libclang-rt-18-dev llvm libunwind-dev python3-numpy python3-venv nodejs jq
      - name: Install Mojo
        run: python3 -m venv .venv && .venv/bin/pip install --quiet mojo==1.1.0
      - name: Test
        run: tests/run.sh --cpu 2>&1 | tee ci.log
        shell: bash
      - name: Badge
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true   # a failed badge write must not turn CI red
        shell: bash
        run: |
          s=$(grep -oE "^(PASS|FAIL) [0-9]+/[0-9]+" ci.log | tail -1 || true)
          if [[ $s =~ ^(PASS|FAIL)\ ([0-9]+)/([0-9]+) ]]; then m=${BASH_REMATCH[3]}; [[ ${BASH_REMATCH[1]} == PASS ]] && p=${BASH_REMATCH[2]} || p=$((m - BASH_REMATCH[2]))
          else p=$(grep -cE "^ok " ci.log || true); m=$((p + $(grep -cE "^(FAIL|not ok)" ci.log || true))); fi
          c=red; ((m > 0 && p == m)) && c=brightgreen
          mkdir -p .b && printf '{"schemaVersion":1,"label":"checks","message":"%s/%s","color":"%s"}\n' $p $m $c > .b/checks.json
          cd .b && git init -q -b badges && git add checks.json && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "checks $p/$m"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges
