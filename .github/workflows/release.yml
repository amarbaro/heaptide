# Builds the prebuilt tarball on every v* tag and attaches it to that tag's GitHub release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libunwind-dev patchelf python3-venv
      - name: Install Mojo
        run: python3 -m venv .venv && .venv/bin/pip install --quiet mojo==1.1.0
      - name: Build and pack
        run: ./build.sh && tools/package.sh "$GITHUB_REF_NAME"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
